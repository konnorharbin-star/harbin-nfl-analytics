name: NFL Verified Historical Market Backtest

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First NFL season"
        required: true
        default: "2022"
        type: string
      end_season:
        description: "Last NFL season"
        required: true
        default: "2025"
        type: string
      refresh:
        description: "Refresh cached provider snapshots"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "nfl/verified_market_backtest.py"
      - "nfl/odds_api.py"
      - "nfl/market_history.py"
      - "nfl/market_backtest.py"
      - "nfl/proof.py"
      - "nfl/policy_calibration.py"
      - "nfl/release_gate.py"
      - "run_verified_market_backtest.py"
      - "run_policy_calibration.py"
      - "tests/test_verified_market_backtest.py"
      - "tests/test_proof.py"
      - "tests/test_policy_calibration.py"
      - "tests/test_monitoring_release.py"
      - ".github/workflows/verified-market-backtest.yml"

permissions:
  contents: write

concurrency:
  group: >-
    nfl-verified-market-backtest-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Verified historical evidence tests
        run: |
          python -m pytest -q \
            tests/test_odds_api.py \
            tests/test_market_history.py \
            tests/test_verified_market_backtest.py \
            tests/test_proof.py \
            tests/test_policy_calibration.py \
            tests/test_monitoring_release.py

  fetch:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      START_SEASON: ${{ inputs.start_season }}
      END_SEASON: ${{ inputs.end_season }}
      REFRESH: ${{ inputs.refresh }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Require optional historical provider key
        shell: bash
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::error::THE_ODDS_API_KEY is required for the manual verified historical backtest."
            exit 1
          fi

      - name: Build timestamped historical evidence
        shell: bash
        run: |
          args=(
            --start-season "$START_SEASON"
            --end-season "$END_SEASON"
          )
          if [ "$REFRESH" = "true" ]; then
            args+=(--refresh)
          fi
          python run_verified_market_backtest.py "${args[@]}"

      - name: Upload verified evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-verified-historical-evidence
          path: |
            reports/verified_market_bets.csv
            reports/verified_market_backtest.json
            reports/evidence_report.json
            reports/production_policy.json

      - name: Commit verified historical evidence
        shell: bash
        run: |
          git config user.name "harbin-nfl-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/verified_market_bets.csv \
            reports/verified_market_backtest.json \
            reports/evidence_report.json \
            reports/production_policy.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: refresh verified NFL historical market proof"
            bash scripts/push_generated_state.sh
          else
            echo "No verified historical evidence changes to commit."
          fi
