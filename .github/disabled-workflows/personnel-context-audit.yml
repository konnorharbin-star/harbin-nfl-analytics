name: Fixed Personnel Context Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/personnel_context.py"
      - "nfl/personnel_context_eval.py"
      - "nfl/personnel_context_audit.py"
      - "nfl/injuries.py"
      - "nfl/personnel.py"
      - "nfl/data.py"
      - "run_personnel_context_audit.py"
      - "tests/test_personnel_context.py"
      - ".github/workflows/personnel-context-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Personnel context integrity tests
        run: python -m pytest -q tests/test_personnel_context.py

      - name: Run real-source fixed personnel audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_personnel_context_audit.py --refresh \
            | tee reports/personnel_context_audit.log

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-fixed-personnel-context-audit
          path: |
            reports/personnel_context_audit.json
            reports/personnel_context_audit.log
