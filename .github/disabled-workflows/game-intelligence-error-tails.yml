name: NFL Extreme Error Intelligence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/game_intelligence_error_tails.py"
      - "run_game_intelligence_error_tails.py"
      - "tests/test_game_intelligence_error_tails.py"
      - ".github/workflows/game-intelligence-error-tails.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Integrity tests
        run: python -m pytest -q tests/test_game_intelligence_error_tails.py
      - name: Evaluate historical error tails
        run: |
          python run_game_intelligence_error_tails.py
          cat reports/game_intelligence_error_tails.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-intelligence-error-tails
          path: reports/game_intelligence_error_tails.json
          if-no-files-found: warn
