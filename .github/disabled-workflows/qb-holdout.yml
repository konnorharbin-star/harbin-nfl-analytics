name: Quarterback State Holdout Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/contracts.py"
      - "nfl/data.py"
      - "nfl/qb_state.py"
      - "nfl/qb_dataset.py"
      - "nfl/qb_residuals.py"
      - "nfl/qb_audit.py"
      - "run_qb_audit.py"
      - "tests/test_qb_state.py"
      - ".github/workflows/qb-holdout.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run quarterback-state holdout audit
        run: |
          mkdir -p reports
          python run_qb_audit.py --refresh | tee reports/qb_holdout_audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: quarterback-state-holdout-audit
          path: reports/qb_holdout_audit.json
