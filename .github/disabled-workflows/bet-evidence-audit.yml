name: NFL Bet Entry Evidence Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/bet_evidence_audit.py"
      - "run_bet_evidence_audit.py"
      - "tests/test_bet_evidence_audit.py"
      - ".github/workflows/bet-evidence-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_bet_evidence_audit.py
      - run: python run_bet_evidence_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-bet-evidence-audit
          path: reports/bet_evidence_audit.json
          if-no-files-found: warn
