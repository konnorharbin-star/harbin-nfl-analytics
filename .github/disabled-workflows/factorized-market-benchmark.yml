name: NFL Factorized Market Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/factorized_market_benchmark.py"
      - "run_factorized_market_benchmark.py"
      - "tests/test_factorized_market_benchmark.py"
      - ".github/workflows/factorized-market-benchmark.yml"

jobs:
  historical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test input integrity
        run: python -m pytest -q tests/test_factorized_market_benchmark.py
      - name: Test architecture against 2024 and 2025 archived market
        run: python run_factorized_market_benchmark.py
      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-factorized-market-benchmark
          path: reports/factorized_market_benchmark.json
          if-no-files-found: warn
