name: NFL Probability Forward Grade

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NFL Probability Forward Capture"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/probability_forward.py"
      - "grade_probability_forward.py"
      - "tests/test_probability_forward.py"
      - ".github/workflows/probability-forward-grade.yml"
      - "docs/STAGE24_PROBABILITY_FORWARD.md"
  push:
    branches: [main]
    paths:
      - "history/probability_shadow_predictions_v1.csv"
      - "nfl/probability_forward.py"
      - "grade_probability_forward.py"
      - ".github/workflows/probability-forward-grade.yml"
  schedule:
    - cron: "12 10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: >-
    nfl-probability-forward-grade-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  grade:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Integrity tests
        run: python -m pytest -q tests/test_probability_forward.py

      - name: Grade prospective probability shadow
        run: python grade_probability_forward.py

      - name: Upload forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: probability-forward-evidence
          path: |
            reports/probability_forward.json
            reports/probability_forward_graded.csv
            docs/probability_forward.json
          if-no-files-found: warn

      - name: Commit graded evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-grade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            reports/probability_forward.json \
            reports/probability_forward_graded.csv \
            docs/probability_forward.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "grade: refresh NFL probability forward evidence"
            bash scripts/push_generated_state.sh
          else
            echo "No new probability forward evidence to commit."
          fi
