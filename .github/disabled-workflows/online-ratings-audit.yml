name: NFL Online Ratings Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/online_ratings.py"
      - "nfl/online_ratings_audit.py"
      - "run_online_ratings_audit.py"
      - "tests/test_online_ratings.py"
      - ".github/workflows/online-ratings-audit.yml"
  push:
    branches: [main]
    paths:
      - "nfl/online_ratings.py"
      - "nfl/online_ratings_audit.py"
      - "run_online_ratings_audit.py"
      - ".github/workflows/online-ratings-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q tests/test_online_ratings.py

      - name: Ruff
        run: ruff check nfl/online_ratings.py nfl/online_ratings_audit.py run_online_ratings_audit.py tests/test_online_ratings.py

      - name: Run 2023-2025 online ratings audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_online_ratings_audit.py --refresh | tee reports/online_ratings_audit.log

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-online-ratings-audit
          path: |
            reports/online_ratings_audit.json
            reports/online_ratings_audit.log
          if-no-files-found: error
