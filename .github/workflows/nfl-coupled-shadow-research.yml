name: NFL MODEL — Our Scores, Spreads, Totals and Player Props
on:
  workflow_dispatch:
    inputs:
      include_experimental_diagnostics:
        description: 'Include unvalidated experimental comparisons (slower)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'nfl/coupled_drive_player_shadow.py'
      - 'nfl/coupled_nflverse_asof.py'
      - 'nfl/web_context_research.py'
      - 'nfl/nflverse_injury_evidence.py'
      - 'scripts/nfl_web_context_research_run.py'
      - 'scripts/nfl_coupled_drive_player_research_run.py'
      - 'scripts/nfl_full_slate_card.py'
      - 'nfl/independent_publication.py'
      - 'nfl/player_workload_shrinkage.py'
      - 'scripts/nfl_player_workload_upgrade.py'
      - 'research/player_workload_shrinkage_frozen.json'
      - 'tests/test_player_workload_shrinkage.py'
      - 'scripts/nfl_independent_predictions.py'
      - 'run_nfl_predictions.py'
      - 'harbin_nfl_model.py'
      - 'tests/test_independent_publication.py'
      - 'scripts/nfl_publish_current_dashboard.py'
      - 'tests/test_nfl_publish_current_dashboard.py'
      - 'nfl/web_model_intake.py'
      - 'nfl/public_article_dates.py'
      - 'nfl/public_game_inputs.py'
      - 'tests/test_public_game_inputs.py'
      - 'nfl/personnel_asof_watch.py'
      - 'scripts/nfl_personnel_asof_watch.py'
      - 'tests/test_personnel_asof_watch.py'
      - 'tests/test_public_article_dates.py'
      - 'tests/test_nflverse_injury_evidence.py'
      - 'scripts/nfl_web_model_intake.py'
      - 'tests/test_web_model_intake.py'
      - 'nfl/full_slate_validation.py'
      - 'scripts/nfl_full_slate_validation_run.py'
      - 'tests/test_full_slate_validation.py'
      - 'scripts/weekly_public_nfl_odds.py'
      - 'tests/test_nfl_full_slate_card.py'
      - 'nfl/coupled_research_journal.py'
      - 'scripts/nfl_coupled_journal_run.py'
      - '.github/workflows/nfl-coupled-shadow-research.yml'
  schedule:
    - cron: '11 13 * 9-12 *'
    - cron: '11 16,19 * 9-12 0'
permissions:
  contents: write
concurrency:
  group: nfl-forward-history-writer
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPERIMENTAL_DIAGNOSTICS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_experimental_diagnostics }}
    steps:
      - name: Enforce separately reviewed 2026 model lineage
        run: test "$(date -u +%Y)" = "2026"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free package dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record active default model and optional research scope
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          enabled = os.environ['EXPERIMENTAL_DIAGNOSTICS'] == 'true'
          report = {
              'predictive_family': 'NFL_PLAYER_WORKLOAD_SHRINKAGE_V2',
              'experimental_diagnostics_enabled': enabled,
              'experimental_steps': ['quarter_state_workload', 'clean_efficiency', 'overtime_score', 'conditional_injury_scenarios'],
              'experimental_steps_used_for_bet_ranking': False,
              'core_forecasts_changed_by_this_cleanup': False,
              'accuracy_improvement_claimed': False,
              'default_pipeline': ['independent_scores_and_player_stats', 'public_web_evidence', 'public_game_and_prop_prices', 'exact_contract_comparison', 'immutable_capture_and_mature_grading'],
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/nfl_run_scope.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Experimental comparisons: ' + ('explicitly enabled' if enabled else 'OFF by default') + '\n\n')
              summary.write('Own forecasts, public evidence/prices, contract comparison and forward grading remain active. This cleanup does not claim improved accuracy.\n\n')
          PY
      - name: Check chronological journal and source integrity
        run: python -m pytest -q tests/test_coupled_research_journal.py tests/test_coupled_forward_grading.py
      - name: Grade durable first-seen forecasts with mature free outcomes
        id: grade
        run: python -m scripts.nfl_coupled_journal_run grade --out reports/coupled_durable_grade.json
      - name: Grade frozen exact-contract selections with mature finals
        run: python -m scripts.nfl_full_slate_validation_run grade --out reports/full_slate_selected_grade.json
      - name: Grade separate workload-v2 forecasts and contract selections
        run: |
          python -m scripts.nfl_coupled_journal_run grade --root history/player_workload_v2_2026 --out reports/workload_v2_grade.json
          python -m scripts.nfl_full_slate_validation_run grade --root history/full_slate_workload_v2_2026 --out reports/workload_v2_selected_grade.json
      - name: Obtain free nflverse and generate independent research forecast artifacts
        run: |
          python -m scripts.nfl_coupled_drive_player_research_run --season 2026 --draws 2000 --out reports/coupled_drive_player_shadow.json
      - name: Publish our independent score, spread, total and player forecasts
        run: |
          python -m scripts.nfl_player_workload_upgrade --journal-root history/player_workload_v2_2026 --run-id "${{ github.run_id }}" --code-sha "$(git rev-parse HEAD)"
          python -m scripts.nfl_independent_predictions --scan reports/workload_v2_scan.json --replay reports/workload_v2_replay.json --resolve-names
          cat outputs/independent_forecasts.md >> "$GITHUB_STEP_SUMMARY"
      - name: Monitor frozen quarter-state workload challenger (not used for betting)
        if: env.EXPERIMENTAL_DIAGNOSTICS == 'true'
        continue-on-error: true
        run: python -m scripts.nfl_game_state_workload_run forecast --out reports/game_state_workload_forward.json
      - name: Monitor video-inspired clean EPA and success-rate challenger
        if: env.EXPERIMENTAL_DIAGNOSTICS == 'true'
        continue-on-error: true
        run: python -m scripts.nfl_clean_efficiency_run forecast --out reports/clean_efficiency_forward.json
      - name: Test per-game injury and publisher issue-time chronology
        run: python -m pytest -q tests/test_nflverse_injury_evidence.py tests/test_public_article_dates.py tests/test_public_game_inputs.py tests/test_web_model_intake.py
      - name: Search public football pages and capture paired prop prices without keys
        run: |
          python -m scripts.nfl_web_model_intake
          cat reports/nfl_web_model_intake.md >> "$GITHUB_STEP_SUMMARY"
      - name: Monitor separate regulation and overtime score challenger (not used for betting)
        if: env.EXPERIMENTAL_DIAGNOSTICS == 'true'
        continue-on-error: true
        run: python -m scripts.nfl_overtime_research_run --out reports/overtime_score_challenger.json
      - name: Capture exact public prices across the upcoming slate
        run: |
          python -m scripts.weekly_public_nfl_odds --season 2026 --hours 192 --max-games 64 --refresh-schedules
      - name: Rank all supported priced contracts and report every target game
        run: |
          python -m scripts.nfl_full_slate_card --forecast reports/workload_v2_scan.json --replay reports/workload_v2_replay.json --prop-contracts reports/nfl_web_prop_contracts.json
          python -m scripts.nfl_full_slate_validation_run freeze --root history/full_slate_workload_v2_2026 --run-id "${{ github.run_id }}" --code-sha "$(git rev-parse HEAD)" --out reports/full_slate_selected_capture.json
          cat reports/nfl_full_slate_card.md >> "$GITHUB_STEP_SUMMARY"
      - name: Research public NFL injury reports, weather and recent news (no model edits)
        run: |
          python -m scripts.nfl_web_context_research_run --forecast-scan reports/coupled_drive_player_shadow.json --out reports/nfl_web_context_research.json
      - name: Freeze pregame personnel uncertainty and original context sources (research only)
        continue-on-error: true
        run: |
          python -m scripts.nfl_personnel_asof_watch --run-id "${{ github.run_id }}"
          cat reports/nfl_personnel_asof_watch.json >> "$GITHUB_STEP_SUMMARY"
      - name: Generate date-stamped conditional injury scenarios (not verified absences)
        if: env.EXPERIMENTAL_DIAGNOSTICS == 'true'
        run: |
          python -m scripts.nfl_web_conditional_research_run --forecast-scan reports/coupled_drive_player_shadow.json --replay-inputs reports/coupled_replay_inputs.json --web-report reports/nfl_web_context_research.json --out reports/nfl_web_conditional_scenarios.json
      - name: Freeze originals in a durable separate first-seen cohort
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_CODE_SHA: ${{ github.sha }}
        run: |
          test -f reports/coupled_drive_player_shadow.json
          sidecar_args=(--sidecar reports/nfl_run_scope.json --sidecar reports/nfl_web_context_research.json --sidecar reports/nfl_web_model_intake.json --sidecar reports/nfl_web_prop_contracts.json)
          if [ "$EXPERIMENTAL_DIAGNOSTICS" = 'true' ]; then
            sidecar_args+=(--sidecar reports/nfl_web_conditional_scenarios.json)
          fi
          python -m scripts.nfl_coupled_journal_run freeze --run-id "$SOURCE_RUN_ID" --code-sha "$(git rev-parse HEAD)" "${sidecar_args[@]}"
      - name: Commit append-only originals and grade revisions
        if: always()
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          test -f reports/coupled_durable_status.json
          python -m scripts.nfl_coupled_journal_run check-pregame --run-id "$SOURCE_RUN_ID"
          python -m scripts.nfl_full_slate_validation_run check-pregame --run-id "$SOURCE_RUN_ID"
          python -m scripts.nfl_coupled_journal_run check-pregame --root history/player_workload_v2_2026 --run-id "$SOURCE_RUN_ID"
          python -m scripts.nfl_full_slate_validation_run check-pregame --root history/full_slate_workload_v2_2026 --run-id "$SOURCE_RUN_ID"
          python -m scripts.nfl_personnel_asof_watch --run-id "$SOURCE_RUN_ID" --check-pregame
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/coupled_primary_v1_2026 history/public_aggregator_quotes_2026.jsonl
          if [ -d history/player_workload_v2_2026 ]; then
            git add history/player_workload_v2_2026
          fi
          if [ -d history/full_slate_workload_v2_2026 ]; then
            git add history/full_slate_workload_v2_2026
          fi
          if [ -d history/full_slate_selected_v1_2026 ]; then
            git add history/full_slate_selected_v1_2026
          fi
          if [ -d history/personnel_asof_v1_2026 ]; then
            git add history/personnel_asof_v1_2026
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve coupled NFL first-seen forecasts and source-grade revisions'
            git pull --rebase origin main
            python -m scripts.nfl_coupled_journal_run check-pregame --run-id "$SOURCE_RUN_ID"
            python -m scripts.nfl_full_slate_validation_run check-pregame --run-id "$SOURCE_RUN_ID"
            python -m scripts.nfl_coupled_journal_run check-pregame --root history/player_workload_v2_2026 --run-id "$SOURCE_RUN_ID"
            python -m scripts.nfl_full_slate_validation_run check-pregame --root history/full_slate_workload_v2_2026 --run-id "$SOURCE_RUN_ID"
            python -m scripts.nfl_personnel_asof_watch --run-id "$SOURCE_RUN_ID" --check-pregame
            git push origin HEAD:main
          fi
      - name: Validate safe independent Pages publisher
        run: python -m pytest -q tests/test_nfl_publish_current_dashboard.py
      - name: Render current football-only research dashboard to GitHub Pages
        run: |
          python -m scripts.nfl_publish_current_dashboard --source outputs --docs docs
          cat docs/independent_latest_meta.json >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/nfl_personnel_asof_watch.json ]; then
            cp reports/nfl_personnel_asof_watch.json docs/independent_personnel_asof.json
          fi
      - name: Commit dated current Pages outputs without rewriting frozen forecasts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/independent_latest.html docs/independent_latest.json \
            docs/independent_latest.png docs/independent_game_predictions.csv \
            docs/independent_player_predictions.csv docs/independent_latest_meta.json
          if [ -f docs/legacy_market_week5.html ]; then
            git add docs/legacy_market_week5.html
          fi
          if [ -f docs/independent_personnel_asof.json ]; then
            git add docs/independent_personnel_asof.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'publish: current independent NFL scores and player props, research only'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive supplemental diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-free-coupled-score-props-RESEARCH-UNVALIDATED
          path: |
            reports/nfl_run_scope.json
            reports/workload_v2_scan.json
            reports/workload_v2_replay.json
            reports/workload_v2_scan.history.parquet
            reports/workload_v2_scan.audit.json
            reports/workload_v2_scan.receipt.json
            reports/workload_v2_grade.json
            reports/workload_v2_selected_grade.json
            outputs/independent_forecasts.json
            outputs/independent_forecasts.md
            outputs/independent_forecasts.html
            outputs/independent_forecasts.png
            outputs/independent_game_predictions.csv
            outputs/independent_player_predictions.csv
            reports/game_state_workload_forward.json
            reports/clean_efficiency_forward.json
            reports/clean_efficiency_forward.source.json.gz
            reports/overtime_score_challenger.json
            reports/nfl_web_model_intake.json
            reports/nfl_web_model_intake.md
            reports/nfl_web_prop_contracts.json
            reports/web_source_snapshots
            reports/full_slate_selected_grade.json
            reports/full_slate_selected_capture.json
            reports/nfl_full_slate_card.json
            reports/nfl_full_slate_card.md
            reports/weekly_public_quote_capture.json
            reports/coupled_drive_player_shadow.json
            reports/nfl_web_context_research.json
            reports/nfl_personnel_asof_watch.json
            reports/coupled_replay_inputs.json
            reports/nfl_web_conditional_scenarios.json
            reports/coupled_durable_status.json
            reports/coupled_durable_grade.json
          if-no-files-found: warn
          retention-days: 45
