name: NFL Nonlinear Ensemble Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/ensemble_dataset.py"
      - "nfl/ensemble_residuals.py"
      - "nfl/ensemble_audit.py"
      - "run_nonlinear_ensemble_audit.py"
      - "tests/test_nonlinear_ensemble.py"
      - ".github/workflows/nonlinear-ensemble-audit.yml"
  push:
    branches: [main]
    paths:
      - "nfl/ensemble_dataset.py"
      - "nfl/ensemble_residuals.py"
      - "nfl/ensemble_audit.py"
      - "run_nonlinear_ensemble_audit.py"
      - ".github/workflows/nonlinear-ensemble-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q tests/test_nonlinear_ensemble.py

      - name: Ruff
        run: ruff check nfl/ensemble_dataset.py nfl/ensemble_residuals.py nfl/ensemble_audit.py run_nonlinear_ensemble_audit.py tests/test_nonlinear_ensemble.py

      - name: Run 2022-2025 nonlinear ensemble audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_nonlinear_ensemble_audit.py --refresh | tee reports/nonlinear_ensemble_audit.log

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-nonlinear-ensemble-audit
          path: |
            reports/nonlinear_ensemble_audit.json
            reports/nonlinear_ensemble_audit.log
          if-no-files-found: error
