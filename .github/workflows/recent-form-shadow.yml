name: Recent Form 2026 Shadow Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/recent_form.py"
      - "nfl/recent_form_dataset.py"
      - "nfl/recent_form_residuals.py"
      - "nfl/recent_form_shadow.py"
      - "nfl/shadow_gate.py"
      - "run_recent_form_shadow.py"
      - "tests/test_recent_form_shadow.py"
      - ".github/workflows/recent-form-shadow.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run frozen recent-form totals shadow audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          for attempt in 1 2 3; do
            echo "Recent-form 2026 shadow attempt ${attempt}/3"
            if python run_recent_form_shadow.py --refresh | tee reports/recent_form_2026_shadow.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "Recent-form 2026 shadow audit failed after 3 attempts" >&2
          exit 1

      - name: Upload shadow report
        uses: actions/upload-artifact@v4
        with:
          name: recent-form-2026-shadow
          path: reports/recent_form_2026_shadow.json
