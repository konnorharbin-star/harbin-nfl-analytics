name: NFL Efficiency Market Challenger

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/efficiency_market_challenger.py"
      - "run_efficiency_market_challenger.py"
      - "tests/test_efficiency_market_challenger.py"
      - ".github/workflows/efficiency-market-challenger.yml"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test strict chronology
        run: python -m pytest -q tests/test_efficiency_market_challenger.py
      - name: Compare 2024 and 2025 NFL projections with archive benchmark
        run: python run_efficiency_market_challenger.py
      - name: Publish evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-efficiency-market-challenger
          path: reports/efficiency_market_challenger.json
          if-no-files-found: warn
