name: NFL Nested Probability Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nfl/temporal_validation.py"
      - "nfl/nested_probability.py"
      - "nfl/nested_probability_audit.py"
      - "run_nested_probability_audit.py"
      - "tests/test_temporal_validation.py"
      - "tests/test_nested_probability.py"
      - "docs/STAGE23_NESTED_VALIDATION.md"
      - ".github/workflows/nested-probability-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: >
          python -m pytest -q
          tests/test_temporal_validation.py
          tests/test_nested_probability.py
          tests/test_probability.py
          tests/test_win_probability.py
      - name: Ruff
        run: ruff check .
      - name: Run 2021-2025 nested probability audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python run_nested_probability_audit.py --refresh --output nested_probability_audit.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nested-probability-audit
          path: nested_probability_audit.json
