name: NFL direction-first bookmaker-neutral research board
on:
  workflow_dispatch:
  schedule:
    - cron: '41 14 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_book_neutral_direction_board.py'
      - 'tests/test_nfl_book_neutral_direction_board.py'
  pull_request:
    paths:
      - 'scripts/nfl_book_neutral_direction_board.py'
      - 'tests/test_nfl_book_neutral_direction_board.py'
      - '.github/workflows/nfl-direction-first-board.yml'
permissions:
  contents: read
jobs:
  preference-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic independent directional tests
        run: python -m pip install pytest && python -m pytest -q tests/test_nfl_book_neutral_direction_board.py
      - name: Build independent football-first board, no odds required
        run: python -m scripts.nfl_book_neutral_direction_board --out reports/book_neutral_direction_board.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-directional-picks-RESEARCH-NO-BETS
          path: reports/book_neutral_direction_board.json
          retention-days: 30
