name: NFL Archived Moneyline Market Baseline Audit (No Bets)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-moneyline-market-audit.yml"
      - "scripts/nfl_moneyline_archived_shrinkage_audit.py"
      - "tests/test_nfl_moneyline_archived_shrinkage_audit.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-elo-against-archival-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free nflverse libraries
        run: python -m pip install -e '.[dev]'
      - name: Validate chronological model/market separation
        run: |
          python -m pytest -q \
            tests/test_nfl_moneyline_archived_shrinkage_audit.py \
            tests/test_nfl_moneyline_elo_research.py
      - name: Assess market-only and frozen Elo mixture on historical cohorts
        run: |
          python -m scripts.nfl_moneyline_archived_shrinkage_audit \
            --report reports/moneyline_archived_shrinkage_audit.json
      - name: Reject wager profitability claim
        run: |
          python - <<'PY'
          import json
          r=json.load(open("reports/moneyline_archived_shrinkage_audit.json"))
          assert r["decision"]=="PASS" and not r["profitable_BetMGM_edge_proven"]
          assert not r["model_wager_recommendations"] and r["actual_wagers"]==0
          assert not r["candidate_was_fit_on_2024_2025"]
          assert r["archive_market_not_an_executable_BetMGM_quote"]
          print("Development:",r["train"])
          print("2023 validation:",r["2023_validation"])
          print("Already inspected 2024/2025:",r["previously_inspected_diagnostics"])
          print("Account-origin BetMGM betting edge: NONE. PASS.")
          PY
      - name: Preserve completed market-relative diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-moneyline-archival-market-holdout-audit
          path: reports/moneyline_archived_shrinkage_audit.json
          if-no-files-found: warn
          retention-days: 90
