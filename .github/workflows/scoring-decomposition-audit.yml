name: NFL Scoring Decomposition Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/scoring_decomposition.py"
      - "nfl/decomposition_eval.py"
      - "nfl/decomposition_audit.py"
      - "run_decomposition_audit.py"
      - "tests/test_scoring_decomposition.py"
      - ".github/workflows/scoring-decomposition-audit.yml"
  push:
    branches: [main]
    paths:
      - "nfl/scoring_decomposition.py"
      - "nfl/decomposition_eval.py"
      - "nfl/decomposition_audit.py"
      - "run_decomposition_audit.py"
      - ".github/workflows/scoring-decomposition-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q tests/test_scoring_decomposition.py

      - name: Ruff
        run: >-
          ruff check nfl/scoring_decomposition.py nfl/decomposition_eval.py
          nfl/decomposition_audit.py run_decomposition_audit.py
          tests/test_scoring_decomposition.py

      - name: Run 2023-2025 scoring decomposition audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_decomposition_audit.py --refresh | tee reports/decomposition_audit.log

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-scoring-decomposition-audit
          path: |
            reports/decomposition_audit.json
            reports/decomposition_audit.log
          if-no-files-found: error
