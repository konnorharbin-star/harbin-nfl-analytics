name: NFL v2 Participation Player Shadow Forward Grading

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-participation-v2-grade.yml"
      - "scripts/grade_participation_prop_v2.py"
      - "tests/test_grade_participation_prop_v2.py"
  workflow_dispatch:
  schedule:
    - cron: "45 11 * 10,11,12 *"

permissions:
  contents: write

concurrency:
  group: nfl-v2-first-seen-graded-player-stat-forward
  cancel-in-progress: false

jobs:
  v2-grade-only-settled:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Only schedule in frozen 2026 study year
        id: guard
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%Y)" != "2026" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free NFL box score and regression tools
        if: steps.guard.outputs.enabled == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Check first-seen chronological grading safeguards
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pytest -q tests/test_grade_participation_prop_v2.py \
            tests/test_participation_conditional_prop_v2.py \
            tests/test_forward_prop_outcome_audit.py
      - name: Only grade prospectively settled Week6+ source predictions
        if: steps.guard.outputs.enabled == 'true'
        run: python -m scripts.grade_participation_prop_v2
      - name: Preserve separate immutable v2 grading ledger
        if: steps.guard.outputs.enabled == 'true'
        run: |
          if [ -f history/prop_participation_outcomes_v2_2026.jsonl ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add history/prop_participation_outcomes_v2_2026.jsonl
            if ! git diff --cached --quiet; then
              git commit -m 'research: first-settled outcomes of previously frozen v2 prop probabilities'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Summarize evidence without BetMGM claims
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open('reports/prop_participation_forward_grade_v2.json'))
          assert r['decision']=='PASS'
          assert not r['approved_betting_model'] and not r['bookmaker_account_price_verified']
          s="\n".join([
            "## Frozen 2026 v2 prospective player-prop outcome evaluation",
            f"original pregame threshold snapshots: {r['first_seen_probability_count']}",
            f"newly graded thresholds: {r['graded_new_threshold_rows']}",
            f"cumulative recorded thresholds: {r['cumulative_graded_threshold_rows']}",
            f"cumulative player-game-stat groups: {r['cumulative_player_game_clusters']}",
            f"pending sources/participation: {r['ungraded_reason_counts']}",
            "No accepted bookmaker price or profitable bet implied.",
          ])
          print(s)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(s+"\n")
          PY
      - name: Preserve v2 forward evaluation report
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-first-seen-player-prop-grade
          path: reports/prop_participation_forward_grade_v2.json
          retention-days: 90
