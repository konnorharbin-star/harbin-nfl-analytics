name: Stage 1 Data Audit

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season to audit"
        required: true
        default: "2025"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run Stage 1 audit
        run: |
          mkdir -p reports
          python run_stage1.py "${{ inputs.season }}" --refresh | tee reports/stage1_audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: stage1-audit-${{ inputs.season }}
          path: reports/stage1_audit.json
