name: Walters Score Research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_walters_score_calibration.py
      - run: python scripts/walters_score_calibration.py --sport nfl --source reports/free_market_predictions.csv --out reports/walters_score_calibration.json
      - uses: actions/upload-artifact@v4
        with:
          name: walters-score-retrospective
          path: reports/walters_score_calibration.json
