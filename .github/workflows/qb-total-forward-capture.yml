name: NFL QB Total Forward Capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/qb_validated.py"
      - "nfl/qb_total_forward.py"
      - "nfl/current.py"
      - "capture_qb_total_forward.py"
      - "tests/test_qb_total_forward.py"
      - ".github/workflows/qb-total-forward-capture.yml"
  push:
    branches: [main]
    paths:
      - "nfl/qb_validated.py"
      - "nfl/qb_total_forward.py"
      - "nfl/current.py"
      - "capture_qb_total_forward.py"
      - ".github/workflows/qb-total-forward-capture.yml"
  schedule:
    - cron: "47 11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('nfl-qb-total-forward-capture-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_run'
      && format('nfl-generated-state-{0}', github.event.workflow_run.head_branch)
      || format('nfl-generated-state-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Integrity tests
        run: python -m pytest -q tests/test_qb_total_forward.py tests/test_current_projection.py

      - name: Capture frozen QB-total shadow
        run: python capture_qb_total_forward.py 2026 --refresh

      - name: Upload prospective ledger
        uses: actions/upload-artifact@v4
        with:
          name: qb-total-forward-ledger
          path: history/qb_total_shadow_predictions_v1.csv
          if-no-files-found: warn

      - name: Commit first-snapshot ledger
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-shadow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f history/qb_total_shadow_predictions_v1.csv ] && git add history/qb_total_shadow_predictions_v1.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "shadow: capture frozen NFL QB-total predictions"
            git pull --rebase origin main
            git push
          else
            echo "No new QB-total shadow rows to commit."
          fi
