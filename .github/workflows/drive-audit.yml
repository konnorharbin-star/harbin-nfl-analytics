name: NFL Drive Efficiency Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/drive_features.py"
      - "nfl/drive_dataset.py"
      - "nfl/drive_fixed.py"
      - "nfl/drive_audit.py"
      - "run_drive_audit.py"
      - "tests/test_drive_features.py"
      - ".github/workflows/drive-audit.yml"
  push:
    branches: [main]
    paths:
      - "nfl/drive_features.py"
      - "nfl/drive_dataset.py"
      - "nfl/drive_fixed.py"
      - "nfl/drive_audit.py"
      - "run_drive_audit.py"
      - ".github/workflows/drive-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q tests/test_drive_features.py

      - name: Ruff
        run: ruff check nfl/drive_features.py nfl/drive_dataset.py nfl/drive_fixed.py nfl/drive_audit.py run_drive_audit.py tests/test_drive_features.py

      - name: Run 2022-2025 drive rolling audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_drive_audit.py --refresh | tee reports/drive_audit.log

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-drive-efficiency-audit
          path: |
            reports/drive_audit.json
            reports/drive_audit.log
          if-no-files-found: error
