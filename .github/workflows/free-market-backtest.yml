name: Free NFL Market Backtest

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: First projection season
        required: true
        default: "2022"
      end_season:
        description: Last projection season
        required: true
        default: "2025"
      validation_season:
        description: Threshold-selection season
        required: true
        default: "2024"
      holdout_season:
        description: Chronological holdout season
        required: true
        default: "2025"
  pull_request:
    branches: [main]
    paths:
      - "nfl/free_market.py"
      - "nfl/free_market_backtest.py"
      - "nfl/backtest_runtime.py"
      - "nfl/entry_integrity.py"
      - "nfl/backtest_audit.py"
      - "nfl/proof.py"
      - "nfl/policy_calibration.py"
      - "run_free_market_backtest.py"
      - "run_policy_calibration.py"
      - "tests/test_entry_integrity.py"
      - "tests/test_policy_calibration.py"
      - ".github/workflows/free-market-backtest.yml"
  push:
    branches: [main]
    paths:
      - "nfl/free_market.py"
      - "nfl/free_market_backtest.py"
      - "nfl/backtest_runtime.py"
      - "nfl/entry_integrity.py"
      - "nfl/backtest_audit.py"
      - "nfl/proof.py"
      - "nfl/policy_calibration.py"
      - "run_free_market_backtest.py"
      - "run_policy_calibration.py"
      - "tests/test_entry_integrity.py"
      - "tests/test_policy_calibration.py"
      - ".github/workflows/free-market-backtest.yml"
  schedule:
    - cron: "43 10 * * 1"

permissions:
  contents: write

concurrency:
  group: free-nfl-market-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run free archive backtest
        shell: bash
        run: |
          START="${{ inputs.start_season || '2022' }}"
          END="${{ inputs.end_season || '2025' }}"
          VALIDATION="${{ inputs.validation_season || '2024' }}"
          HOLDOUT="${{ inputs.holdout_season || '2025' }}"
          python run_free_market_backtest.py \
            --start-season "$START" \
            --end-season "$END" \
            --validation-season "$VALIDATION" \
            --holdout-season "$HOLDOUT" \
            --refresh

      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: free-nfl-market-backtest
          path: |
            reports/free_market_predictions.csv
            reports/free_market_bets.csv
            reports/free_market_bets_runtime.csv
            reports/free_market_backtest.json
            reports/free_market_runtime.json
            reports/free_market_by_market.csv
            reports/free_market_by_season.csv
            reports/free_market_by_week.csv
            reports/free_market_by_role.csv
            reports/free_market_by_side_location.csv
            reports/backtest_audit.json
            reports/evidence_report.json
            reports/production_policy.json

      - name: Commit canonical evidence snapshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/free_market_backtest.json \
            reports/free_market_bets.csv \
            reports/backtest_audit.json \
            reports/evidence_report.json \\
            reports/production_policy.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: refresh free NFL historical market proof"
            git pull --rebase origin main
            git push
          else
            echo "No canonical historical evidence changes to commit."
          fi
