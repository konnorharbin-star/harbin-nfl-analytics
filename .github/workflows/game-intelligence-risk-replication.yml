name: NFL Risk Combination Replication

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/game_intelligence_risk_replication.py"
      - "run_game_intelligence_risk_replication.py"
      - "tests/test_game_intelligence_risk_replication.py"
      - ".github/workflows/game-intelligence-risk-replication.yml"

jobs:
  historical-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test frozen cohorts
        run: python -m pytest -q tests/test_game_intelligence_risk_replication.py
      - name: Reconstruct historical QB OL data
        run: python run_game_intelligence_risk.py
      - name: Audit frozen two-season replication
        run: |
          python run_game_intelligence_risk_replication.py
          python -c 'import json; p=json.load(open("reports/game_intelligence_risk_replication.json")); print({k:p[k] for k in ("status","seasons","independent_2026_forward_validation_required")})'
      - name: Publish historical research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-risk-combination-replication
          path: |
            reports/game_intelligence_risk_replication.json
            reports/game_intelligence_risk.json
          if-no-files-found: warn
