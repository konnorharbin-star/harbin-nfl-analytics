name: NFL QB Total Forward Grade

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NFL QB Total Forward Capture"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/qb_total_forward.py"
      - "grade_qb_total_forward.py"
      - "tests/test_qb_total_forward.py"
      - ".github/workflows/qb-total-forward-grade.yml"
  push:
    branches: [main]
    paths:
      - "history/qb_total_shadow_predictions_v1.csv"
      - "nfl/qb_total_forward.py"
      - "grade_qb_total_forward.py"
      - ".github/workflows/qb-total-forward-grade.yml"
  schedule:
    - cron: "52 10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('nfl-qb-total-forward-grade-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_run'
      && format('nfl-generated-state-{0}', github.event.workflow_run.head_branch)
      || format('nfl-generated-state-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  grade:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Integrity tests
        run: python -m pytest -q tests/test_qb_total_forward.py

      - name: Grade prospective QB-total shadow
        run: python grade_qb_total_forward.py

      - name: Upload forward evidence
        uses: actions/upload-artifact@v4
        with:
          name: qb-total-forward-evidence
          path: |
            reports/qb_total_forward.json
            reports/qb_total_forward_graded.csv
            docs/qb_total_forward.json
          if-no-files-found: warn

      - name: Commit graded evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-grade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            reports/qb_total_forward.json \
            reports/qb_total_forward_graded.csv \
            docs/qb_total_forward.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "grade: refresh NFL QB-total forward evidence"
            git pull --rebase origin main
            git push
          else
            echo "No new QB-total forward evidence to commit."
          fi
