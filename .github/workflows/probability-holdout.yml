name: Probability Calibration Holdout Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/probability.py"
      - "nfl/probability_runtime.py"
      - "nfl/probability_runtime.py"
      - "nfl/probability_audit.py"
      - "nfl/ratings.py"
      - "nfl/recency.py"
      - "run_probability_audit.py"
      - "tests/test_probability.py"
      - "tests/test_probability_runtime.py"
      - "tests/test_probability_runtime.py"
      - ".github/workflows/probability-holdout.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Probability unit tests
        run: python -m pytest -q tests/test_probability.py tests/test_probability_runtime.py

      - name: Probability unit tests
        run: >
          python -m pytest -q
          tests/test_probability.py
          tests/test_probability_runtime.py

      - name: Run probability calibration holdout
        run: |
          mkdir -p reports
          python run_probability_audit.py --refresh | tee reports/probability_holdout.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: probability-calibration-holdout
          path: reports/probability_holdout.json
