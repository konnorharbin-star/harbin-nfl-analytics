name: NFL Prop Official-Stat Grade Journal Integrity — Research Only
on:
  pull_request:
    paths:
      - "scripts/nfl_prop_paired_cdf_forward_grader.py"
      - "scripts/nfl_prop_grade_journal_integrity.py"
      - "tests/test_nfl_prop_grade_journal_integrity.py"
      - "tests/test_nfl_prop_paired_cdf_forward_grader.py"
      - "docs/NFL_PROP_GRADE_JOURNAL_INTEGRITY_V429.md"
      - ".github/workflows/nfl-prop-grade-journal-integrity-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/nfl_prop_paired_cdf_forward_grader.py"
      - "scripts/nfl_prop_grade_journal_integrity.py"
      - "tests/test_nfl_prop_grade_journal_integrity.py"
      - ".github/workflows/nfl-prop-grade-journal-integrity-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-grade-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install original research dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate original and chained 72-hour mature grade tests
        run: python -m pytest -q tests/test_nfl_prop_grade_journal_integrity.py tests/test_nfl_prop_paired_cdf_forward_grader.py tests/test_nfl_prop_primary_anchor_cohort.py tests/test_nfl_prop_primary_anchor_score.py
      - name: Never misclassify tests as executable edge
        run: |
          python - <<'PY'
          from scripts.nfl_prop_grade_journal_integrity import validate_grade_journal
          assert validate_grade_journal([],[]) == {}
          print("PASS: synthetic grader tests only; no outcomes, odds or wagers introduced")
          PY
