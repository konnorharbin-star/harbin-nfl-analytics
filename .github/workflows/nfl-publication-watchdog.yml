name: NFL Published Board Freshness Watchdog

on:
  workflow_dispatch:
  schedule:
    # Check after the model's 15-minute refresh cron, not simultaneously.
    # GitHub schedule delivery is best-effort; manual dispatch is also available.
    - cron: "7,37 9-23 * 1,9-12 0"
    - cron: "7,37 0-5 * 1,9-12 1"
    - cron: "7,37 18-23 * 1,9-12 1"
    - cron: "7,37 0-5 * 1,9-12 2"
    - cron: "7,37 18-23 * 1,9-12 4"
    - cron: "7,37 0-5 * 1,9-12 5"
    - cron: "7,37 9-23 * 1,12 6"

permissions:
  contents: read
concurrency:
  group: nfl-published-board-watchdog-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify complete remote board and pre-kickoff refresh age
        run: |
          python scripts/check_publication_watchdog.py \
            --github-summary "$GITHUB_STEP_SUMMARY"
