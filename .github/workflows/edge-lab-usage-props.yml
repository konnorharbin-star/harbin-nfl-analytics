name: Edge Lab NFL Player Usage Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-usage-props.yml"
      - "scripts/usage_prop_research.py"
      - "tests/test_usage_prop_research.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-lab-usage-props
  cancel-in-progress: true

jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free NFL dependency stack
        run: python -m pip install -e '.[dev]'
      - name: Verify time-cutoff and missing-data regression tests
        run: python -m pytest -q tests/test_usage_prop_research.py
      - name: Evaluate 2024 development and 2025 historical diagnostic
        run: python -m scripts.usage_prop_research --output reports/usage_prop_2024_2025.json
      - name: Print bounded scorecard to workflow summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('reports/usage_prop_2024_2025.json'))
          lines=["## Research-only NFL usage-vs-baseline diagnostic",
                 "2024: select usage lookback. 2025: previously inspected diagnostic.",
                 "Markets and win/loss picks: NO REAL BETS, no BetMGM quote."]
          for k,v in r["by_market"].items():
              lines.append(f"- {k}: {v.get('status')}, usage MAE={v.get('usage_challenger',{}).get('mae')}, existing MAE={v.get('existing_challenger_same_rows',{}).get('mae')}, matched={v.get('matched_rows')}, CI={v.get('week_clustered_mae_difference_ci95')}")
          summary="\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as handle:
              handle.write(summary+"\n")
          PY
      - name: Archive source-fingerprinted research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-lab-usage-props-research
          path: reports/usage_prop_2024_2025.json
          retention-days: 90
