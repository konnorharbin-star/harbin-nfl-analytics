name: Edge Lab Automatically Freeze v2 NFL Pregame Props

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-auto-freeze-v2.yml"
      - "scripts/auto_freeze_participation_v2.py"
      - "tests/test_auto_freeze_participation_v2.py"
  workflow_dispatch:
  schedule:
    - cron: "16 10 * 9,10,11,12 *"

permissions:
  contents: write

concurrency:
  group: nfl-v2-pregame-player-prop-shadow-journal
  cancel-in-progress: false

jobs:
  pregame-frozen-player-probabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Guard 2026-only frozen model lineage
        id: guard
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%Y)" != "2026" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free public NFL data libraries
        if: steps.guard.outputs.enabled == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Protect future-kickoff and unchanged-model gates
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pytest -q \
            tests/test_auto_freeze_participation_v2.py \
            tests/test_participation_conditional_prop_v2.py \
            tests/test_grade_participation_prop_v2.py
      - name: Freeze 10-day approaching NFL v2 prop probability shadows
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m scripts.auto_freeze_participation_v2 \
            --season 2026 --horizon-days 10 \
            --freeze history/prop_participation_shadow_v2_2026.csv \
            --report reports/auto_freeze_participation_v2.json
      - name: Preserve append-only first-seen record before kickoff
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/prop_participation_shadow_v2_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m 'research: chronologically freeze upcoming NFL v2 player probabilities'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Explicitly mark no bet, no actual BetMGM quote
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import os,json
          r=json.load(open('reports/auto_freeze_participation_v2.json'))
          assert r['decision']=='PASS'
          assert not r['approved_betting_model'] and r['actual_bet_count']==0
          s="\n".join([
            "## Upcoming NFL v2 player prop probability captures",
            f"Upcoming NFL weeks: {r['eligible_upcoming_weeks']}",
            f"New frozen synthetic half-point prop probabilities: {r['first_seen_unique_synthetic_forecasts_added']}",
            f"Upcoming week details: {r['upcoming_week_results']}",
            "Models calibrated on 2024; latest 2026 features pregame only.",
            "Original account-accepted U.S. BetMGM odds: NOT VERIFIED.",
            "Betting decision: PASS, zero wagers.",
          ])
          print(s)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(s+"\n")
          PY
      - name: Preserve original time and coverage diagnostic
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-v2-scheduled-pregame-freeze-report
          path: reports/auto_freeze_participation_v2.json
          retention-days: 90
