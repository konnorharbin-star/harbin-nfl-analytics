name: NFL Model + Operations

on:
  workflow_call:
    inputs:
      season:
        description: "NFL season year"
        required: false
        default: "2026"
        type: string
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
        type: string
      history_seasons:
        description: "Number of prior seasons for probability history"
        required: false
        default: "4"
        type: string
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year"
        required: true
        default: "2026"
        type: string
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
        type: string
      history_seasons:
        description: "Number of prior seasons for probability history"
        required: false
        default: "4"
        type: string
  workflow_run:
    workflows:
      - "NFL Verified Historical Market Backtest"
      - "Free ESPN Historical Market Backtest"
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/pipeline.py"
      - "nfl/context.py"
      - "nfl/injuries.py"
      - "nfl/personnel.py"
      - "nfl/current.py"
      - "nfl/pregame.py"
      - "nfl/data.py"
      - "nfl/data_integrity.py"
      - "nfl/decision_intelligence.py"
      - "nfl/weather.py"
      - "nfl/pro_market.py"
      - "nfl/schedule_market.py"
      - "nfl/market_intel.py"
      - "nfl/market.py"
      - "nfl/probability.py"
      - "nfl/probability_runtime.py"
      - "nfl/regime_reliability.py"
      - "nfl/win_probability.py"
      - "nfl/execution_market.py"
      - "nfl/policy.py"
      - "nfl/portfolio.py"
      - "nfl/pregame_refresh.py"
      - "nfl/qb_current.py"
      - "nfl/line_history.py"
      - "nfl/release_gate.py"
      - "nfl/model_card.py"
      - "nfl/monitoring.py"
      - "nfl/render.py"
      - "nfl/publication.py"
      - "nfl/reporting.py"
      - "scripts/push_generated_state.sh"
      - "scripts/should_pregame_refresh.py"
      - "tests/test_context.py"
      - "tests/test_current_projection.py"
      - "tests/test_data_integrity.py"
      - "tests/test_decision_intelligence.py"
      - "tests/test_operational_parity.py"
      - "tests/test_probability.py"
      - "tests/test_probability_runtime.py"
      - "tests/test_regime_reliability.py"
      - "tests/test_win_probability.py"
      - "tests/test_pregame_refresh.py"
      - "tests/test_qb_current.py"
      - "tests/test_render.py"
      - "tests/test_stage7_publication.py"
      - "tests/test_generated_state_push_reconciliation.py"
      - "tests/test_monitoring_release.py"
      - "tests/test_depth_source.py"
      - "tests/test_weather_resilience.py"
      - "tests/test_market_outage_failclosed.py"
      - "tests/test_schedule_market.py"
      - ".github/workflows/nfl-model.yml"
      - ".github/workflows/nfl-pregame-refresh.yml"
  push:
    branches: [main]
    paths-ignore: ["outputs/**", "history/**", "reports/**", "docs/**"]
  schedule:
    - cron: "17 11,17,23 * * *"
permissions:
  contents: write
concurrency:
  group: >-
    nfl-model-operations-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  model:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      TZ: America/Chicago
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Refresh completed-game grading
        run: python grade_live.py

      - name: Run model + monitoring + release + portfolio + reporting
        shell: bash
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          HISTORY="${{ inputs.history_seasons || '4' }}"
          ARGS="$SEASON --history-seasons $HISTORY --refresh"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          python harbin_nfl_model.py $ARGS

      - name: Validate public publication bundle
        run: python validate_publication.py

      - name: Publish run summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path="outputs/current_model.json"
          if not os.path.exists(path):
              print("## NFL model\nNo canonical report was produced.")
              raise SystemExit(0)
          report=json.load(open(path))
          meta=report.get("meta",{}); market=meta.get("market_coverage",{}); intel=meta.get("market_intelligence",{}); decision=meta.get("decision_intelligence",{}); quality=meta.get("data_quality",{}); regime=intel.get("regime_reliability",{}) if isinstance(intel,dict) else {}; port=report.get("portfolio",{}); gate=report.get("release_gate",{}); mon=report.get("monitoring",{}); prob=meta.get("probability",{}); ctx=meta.get("current_context",{}); pub=report.get("publication",{}); bundle=pub.get("bundle",{}) if isinstance(pub,dict) else {}
          print(f"## Harbin NFL Analytics — {meta.get('season')} Week {meta.get('week')}")
          print(f"- Release state: **{gate.get('release_state','UNKNOWN')}** · Production eligible: **{gate.get('production_eligible',False)}**")
          print(f"- Verified ML/Spread/Total: **{market.get('moneyline',0)}/{market.get('spread',0)}/{market.get('total',0)}**")
          print(f"- Research ML/Spread/Total: **{intel.get('research_moneyline',0)}/{intel.get('research_spread',0)}/{intel.get('research_total',0)}**")
          print(f"- Distinct verified books: **{intel.get('distinct_books',0)}** · Multi-book coverage: **{float(intel.get('multi_book_coverage',0) or 0):.1%}**")
          print(f"- Decision intelligence: **{decision.get('status','UNKNOWN')}** · Shadow actions: **{decision.get('research_execution_actions',{})}** · High disagreement: **{decision.get('high_disagreement_rows',0)}**")
          print(f"- Data integrity: **{quality.get('status','UNKNOWN')}** · Missing: **{quality.get('missing_data_count',0)}** · Future/post-kickoff quotes: **{quality.get('future_verified_quote_rows',0)}/{quality.get('post_kickoff_verified_quote_rows',0)}**")
          print(f"- Probability: **{prob.get('model_family','unknown')}** · Reliability ready: **{prob.get('reliability_ready',False)}**")
          print(f"- Brier/ECE: **{prob.get('home_win_brier','n/a')} / {prob.get('home_win_ece','n/a')}** · Margin/Total 80% coverage: **{prob.get('margin_80_coverage','n/a')} / {prob.get('total_80_coverage','n/a')}**")
          print(f"- 58%-62% band: **n={prob.get('mid_confidence_games',0)} · predicted={prob.get('mid_confidence_mean_probability','n/a')} · actual={prob.get('mid_confidence_actual_rate','n/a')}**")
          print(f"- Regime reliability: **{regime.get('market_status',{})}** · Operational ready: **{regime.get('operational_ready',False)}**")
          print(f"- QB coverage: **{ctx.get('qb_coverage',0):.1%}** · Broad context: **{ctx.get('coverage',0):.1%}** · Depth feed: **{ctx.get('depth_feed_available',False)}**")
          print(f"- Weather errors: **{len(ctx.get('weather_errors',[]) or [])}**")
          print(f"- Portfolio mode: **{str(port.get('mode','paper')).upper()}** · Approved stake: **{port.get('approved_units',0)}u**")
          print(f"- Live readiness: **{mon.get('live_readiness_score','n/a')}/100**")
          print(f"- Weekly board: **{pub.get('html','not produced')}**")
          print(f"- Publication reconciliation: **{bundle.get('status','UNKNOWN')}**")
          if gate.get("blockers"):
              print("- Production blockers: " + "; ".join(gate["blockers"][:5]))
          PY

      - name: Commit generated state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs history reports docs

          # Historical proof has a separate canonical writer: free-market-backtest.yml.
          # Never include these files in a live-model commit, even if the operational
          # pipeline recomputed them while building its in-memory release evidence.
          HISTORICAL_PROOF=(
            reports/free_market_backtest.json
            reports/free_market_bets.csv
            reports/backtest_audit.json
            reports/evidence_report.json
          )
          git reset -- "${HISTORICAL_PROOF[@]}"
          git restore -- "${HISTORICAL_PROOF[@]}"

          # Live market capture has its own canonical writer: line-capture.yml.
          # Excluding these files prevents the model job from racing line capture
          # and failing during the generated-state rebase/push step.
          LIVE_LINE_STATE=(
            history/market_snapshots.csv
            outputs/line_capture_status.json
          )
          git reset -- "${LIVE_LINE_STATE[@]}"
          git restore -- "${LIVE_LINE_STATE[@]}"

          if ! git diff --cached --quiet; then
            git commit -m "model: automated NFL operational refresh"
            bash scripts/push_generated_state.sh
          else
            echo "No generated changes to commit."
          fi

      - name: Verify published model and PNG reached target branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          git fetch origin "$TARGET_BRANCH"
          export TARGET_BRANCH
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          report = json.loads(Path("outputs/current_model.json").read_text())
          publication = report.get("publication", {})
          latest = publication.get("latest_png") or "outputs/latest.png"
          pages = publication.get("png_pages") or []
          cache_safe_pages = publication.get("cache_safe_png_pages") or []
          paths = [
              "outputs/current_model.json",
              latest,
              *pages,
              *cache_safe_pages,
          ]

          branch = os.environ["TARGET_BRANCH"]
          checked = []
          for raw_path in paths:
              path = str(raw_path)
              local_path = Path(path)
              if not local_path.exists() or local_path.stat().st_size <= 0:
                  raise SystemExit(f"missing local publication artifact: {path}")
              local = local_path.read_bytes()
              try:
                  remote = subprocess.check_output(
                      ["git", "show", f"origin/{branch}:{path}"]
                  )
              except subprocess.CalledProcessError as exc:
                  raise SystemExit(
                      f"published artifact missing from origin/{branch}: {path}"
                  ) from exc
              local_sha = hashlib.sha256(local).hexdigest()
              remote_sha = hashlib.sha256(remote).hexdigest()
              if local_sha != remote_sha:
                  raise SystemExit(
                      f"published artifact is stale on origin/{branch}: {path}"
                  )
              checked.append(path)

          print("Verified published artifacts: " + ", ".join(checked))
          PY
