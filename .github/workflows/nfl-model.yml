name: NFL Model + Operations

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year"
        required: true
        default: "2026"
        type: string
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
        type: string
      history_seasons:
        description: "Number of prior seasons for probability history"
        required: false
        default: "4"
        type: string
  push:
    branches: [main]
    paths-ignore: ["outputs/**", "history/**", "reports/**", "docs/**"]
  schedule:
    - cron: "17 11,17,23 * * *"
permissions:
  contents: write
concurrency:
  group: nfl-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
      TZ: "America/Chicago"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Run model + monitoring + release + portfolio + reporting
        shell: bash
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          HISTORY="${{ inputs.history_seasons || '4' }}"
          ARGS="$SEASON --history-seasons $HISTORY --refresh"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          python harbin_nfl_model.py $ARGS

      - name: Publish run summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path="outputs/current_model.json"
          if not os.path.exists(path):
              print("## NFL model\nNo canonical report was produced.")
              raise SystemExit(0)
          report=json.load(open(path))
          meta=report.get("meta",{}); market=meta.get("market_coverage",{}); intel=meta.get("market_intelligence",{}); port=report.get("portfolio",{}); gate=report.get("release_gate",{}); mon=report.get("monitoring",{}); prob=meta.get("probability",{}); ctx=meta.get("current_context",{}); pub=report.get("publication",{})
          print(f"## Harbin NFL Analytics — {meta.get('season')} Week {meta.get('week')}")
          print(f"- Release state: **{gate.get('release_state','UNKNOWN')}** · Production eligible: **{gate.get('production_eligible',False)}**")
          print(f"- ML/Spread/Total: **{market.get('moneyline',0)}/{market.get('spread',0)}/{market.get('total',0)}**")
          print(f"- Distinct books: **{intel.get('distinct_books',0)}** · Multi-book coverage: **{float(intel.get('multi_book_coverage',0) or 0):.1%}**")
          print(f"- Brier: **{prob.get('home_win_brier','n/a')}** · Margin/Total 80% coverage: **{prob.get('margin_80_coverage','n/a')} / {prob.get('total_80_coverage','n/a')}**")
          print(f"- QB coverage: **{ctx.get('qb_coverage',0):.1%}** · Broad context: **{ctx.get('coverage',0):.1%}**")
          print(f"- Portfolio mode: **{str(port.get('mode','paper')).upper()}** · Approved stake: **{port.get('approved_units',0)}u**")
          print(f"- Live readiness: **{mon.get('live_readiness_score','n/a')}/100**")
          print(f"- Weekly board: **{pub.get('html','not produced')}**")
          if gate.get("blockers"):
              print("- Production blockers: " + "; ".join(gate["blockers"][:5]))
          PY

      - name: Commit generated state
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs history reports docs
          if ! git diff --cached --quiet; then
            git commit -m "model: automated NFL operational refresh"
            git pull --rebase origin main
            git push
          else
            echo "No generated changes to commit."
          fi
