name: NFL First-Party Editorial Player Prop Research Bridge
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-editorial-prop-bridge.yml"
      - "scripts/first_party_prop_quote_bridge.py"
      - "tests/test_first_party_prop_quote_bridge.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source, identity, quote and time guards
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_first_party_prop_quote_bridge.py
      - name: Smoke test against actual original frozen 2026 v2 cohort
        run: |
          python - <<'PY'
          import csv,json
          from datetime import datetime,timezone
          from pathlib import Path
          from scripts.first_party_prop_quote_bridge import research_match
          path=Path("history/prop_participation_shadow_v2_2026.csv")
          with path.open(newline="",encoding="utf8") as f:
              rows=list(csv.DictReader(f))
          assert rows, "Missing original v2 probability journal"
          out=research_match(rows,{"quotes":[]},
              observed_utc=datetime.now(timezone.utc).isoformat())
          assert out["decision"]=="PASS"
          assert out["profitable_edges_verified"]==0
          assert out["account_executable_betmgm_offers"]==0
          assert out["betting_recommendations"]==[]
          report={"journal_original_threshold_rows":len(rows),
                  "journal_path":str(path),
                  "source_provenance":"PREEXISTING_FROZEN_ORIGINAL",
                  **out}
          target=Path("reports/editorial_prop_bridge_ci.json")
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("Original 2026 frozen rows:",len(rows))
          print("Betting decision: PASS; no executable quotes")
          PY
      - name: Attach research-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-prop-research-only-audit
          path: reports/editorial_prop_bridge_ci.json
          if-no-files-found: warn
          retention-days: 90
