name: NFL Candidate Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nfl/candidate_benchmark.py"
      - "nfl/recency.py"
      - "nfl/recency_audit.py"
      - "nfl/priors.py"
      - "nfl/prior_audit.py"
      - "nfl/opponent_adjusted.py"
      - "nfl/oa_dataset.py"
      - "nfl/oa_residuals.py"
      - "nfl/oa_audit.py"
      - "nfl/qb_state.py"
      - "nfl/qb_dataset.py"
      - "nfl/qb_residuals.py"
      - "nfl/qb_audit.py"
      - "run_candidate_benchmark.py"
      - "tests/test_candidate_benchmark.py"
      - ".github/workflows/candidate-benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "nfl/candidate_benchmark.py"
      - "nfl/recency.py"
      - "nfl/recency_audit.py"
      - "nfl/priors.py"
      - "nfl/prior_audit.py"
      - "nfl/opponent_adjusted.py"
      - "nfl/oa_dataset.py"
      - "nfl/oa_residuals.py"
      - "nfl/oa_audit.py"
      - "nfl/qb_state.py"
      - "nfl/qb_dataset.py"
      - "nfl/qb_residuals.py"
      - "nfl/qb_audit.py"
      - "run_candidate_benchmark.py"
      - "tests/test_candidate_benchmark.py"
      - ".github/workflows/candidate-benchmark.yml"

permissions:
  contents: write

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('nfl-candidate-benchmark-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_run'
      && format('nfl-generated-state-{0}', github.event.workflow_run.head_branch)
      || format('nfl-generated-state-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run rolling-origin candidate benchmark
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_candidate_benchmark.py --refresh \
            | tee reports/candidate_benchmark.log

      - name: Publish research copy
        run: |
          cp reports/candidate_benchmark.json docs/candidate_benchmark.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-candidate-benchmark
          path: |
            reports/candidate_benchmark.json
            reports/candidate_benchmark.log
            docs/candidate_benchmark.json

      - name: Commit canonical research evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/candidate_benchmark.json docs/candidate_benchmark.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh NFL candidate benchmark"
            git pull --rebase origin main
            git push
          else
            echo "No candidate benchmark changes to commit."
          fi
