name: NFL Game Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * 2"

permissions:
  contents: write

jobs:
  game-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test game intelligence
        run: python -m pytest -q tests/test_game_intelligence.py
      - name: Generate current-season intelligence
        run: python run_game_intelligence.py --refresh
      - name: Upload audited dataset
        uses: actions/upload-artifact@v4
        with:
          name: nfl-game-intelligence
          path: |
            reports/game_intelligence.csv
            reports/game_intelligence.json
      - name: Commit generated dataset
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/game_intelligence.csv reports/game_intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh NFL game intelligence"
            bash scripts/push_generated_state.sh
          fi
