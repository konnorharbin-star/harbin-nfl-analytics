name: BetMGM Edge Lab Free Pregame Research

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-free-pregame.yml"
      - "scripts/edge_lab_free_gate.py"
      - "tests/test_edge_lab_free_gate.py"
  workflow_dispatch:
  schedule:
    # One-time Bills-Rams research runs on 2026-10-12, guarded by year check.
    - cron: "0 18,23 12 10 *"

permissions:
  contents: read

concurrency:
  group: edge-lab-free-pregame
  cancel-in-progress: true

jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Guard the exact one-day schedule
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%F)" != "2026-10-12" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled launch date expired."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Python 3.12
        if: steps.window.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FREE-source NFL dependencies
        if: steps.window.outputs.enabled == 'true'
        run: python -m pip install -e '.[dev]'

      - name: Run safety tests and current-model contracts
        if: steps.window.outputs.enabled == 'true'
        run: python -m pytest -q tests/test_edge_lab_free_gate.py tests/test_current_projection.py

      - name: Retrieve free NFL data and generate Bills-Rams independent forecast
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p reports
          python run_current_projection.py 2026 --week 5 --refresh --blocked-report \
            > reports/edge_lab_engine.json

      - name: Produce dated, fail-closed research gate
        if: steps.window.outputs.enabled == 'true'
        run: |
          python -m scripts.edge_lab_free_gate \
            --projection reports/edge_lab_engine.json \
            --game-id 2026_05_BUF_LA \
            --output reports/edge_lab_pregame_research.json

      - name: Summarize safely in job output
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path("reports/edge_lab_pregame_research.json").read_text())
          summary="\n".join([
             "## Bills-Rams free pregame audit",
             f"Status: {x['status']}",
             f"Decision: {x['decision']} — no wager authorized",
             f"Executable U.S. BetMGM quote verified: {x['execution_quote_verified']}",
             f"Source SHA: {x.get('source_repository_sha')}",
             "All projections and blockers are preserved in the run artifact."
          ])
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
             f.write(summary+"\n")
          PY

      - name: Upload frozen results for inspection
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edge-lab-free-pregame
          path: reports/edge_lab_*.json
          retention-days: 30
