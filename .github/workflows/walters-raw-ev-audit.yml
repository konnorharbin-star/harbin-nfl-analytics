name: Walters NFL Raw EV Reliability Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/walters_raw_ev_reliability.py"
      - "tests/test_walters_raw_ev_reliability.py"
      - ".github/workflows/walters-raw-ev-audit.yml"
      - ".github/workflows/nfl-model.yml"
  push:
    branches: [main]
    paths:
      - "scripts/walters_raw_ev_reliability.py"
      - "tests/test_walters_raw_ev_reliability.py"
      - ".github/workflows/walters-raw-ev-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test raw-EV research contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_walters_raw_ev_reliability.py
      - name: Audit historical archived spread predictions
        run: python -m scripts.walters_raw_ev_reliability
      - name: Publish diagnostic-only evidence
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          obj=json.load(open("reports/walters_nfl_raw_ev_calibration.json"))
          scores=obj["2025_probability_scores"]
          tail=obj["2025_spread_archive_large_ev_tails"]["raw_ev_at_least_20_pct"]
          print("### Retrospective archive, NOT independently verified executable bets")
          print("2024-selected log-odds model weight:", obj["chosen_alpha_2024_only"])
          print("2025 no-vig market Brier:", scores["market_only"]["brier"])
          print("2025 earlier model Brier:", scores["full_raw_model"]["brier"])
          print("2025 archived raw EV >= 20% entries:", tail["observations"])
          print("2025 hypothetical archive ROI of that segment:", tail["archive_roi"])
          print("Wager authorization: NONE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: walters-nfl-raw-ev-audit
          path: reports/walters_nfl_raw_ev_calibration.json
          if-no-files-found: error
