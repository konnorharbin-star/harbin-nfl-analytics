name: Edge Lab Crossbook Proxy Research

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-crossbook-watch.yml"
      - "scripts/crossbook_price_watch.py"
      - "tests/test_crossbook_price_watch.py"
  workflow_dispatch:
  schedule:
    - cron: "39 8,16,23 * 9,10,11,12 *"

permissions:
  contents: read

jobs:
  crossbook-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-validity and false-edge regression suite
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_crossbook_price_watch.py
      - name: Audit actual captured NFL source data
        run: |
          python -m scripts.crossbook_price_watch \
            --journal history/public_aggregator_quotes_2026.jsonl \
            --report reports/crossbook_research_watch.json
      - name: Explicit research-only status and bookmaker limitations
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open("reports/crossbook_research_watch.json"))
          assert r["decision"]=="PASS"
          assert r["best_validated_betmgm_edge"] is None
          assert not r["bet_recommendations"]
          s="\n".join([
            "## NFL cross-book exact-market public snapshot study",
            f"Distinct NFL events: {r['distinct_events_checked']}",
            f"Same threshold with >=3 named other books: {r['comparable_same_threshold_selections']}",
            f"Research-only conservative market-price proxy flags: {r['market_proxy_research_watches']}",
            "Original book update timestamps: NOT AVAILABLE.",
            "Account executable U.S. BetMGM quote: NOT VERIFIED.",
            "Independently calibrated true EV: NOT PROVEN.",
            "No wagering decision: PASS.",
          ])
          print(s)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(s+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-contract-crossbook-research
          path: reports/crossbook_research_watch.json
          retention-days: 90
