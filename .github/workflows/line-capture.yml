name: NFL Market Line Capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year (blank = auto-detect)"
        required: false
        default: ""
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "nfl/line_history.py"
      - "tests/test_market_snapshot_provenance.py"
      - ".github/workflows/line-capture.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: >-
    nfl-line-capture-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Capture current markets
        shell: bash
        run: |
          ARGS="--refresh"
          [ -n "${{ inputs.season }}" ] && ARGS="$ARGS --season ${{ inputs.season }}"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          python capture_lines.py $ARGS

      - name: Compare captured identical-line prices
        run: python -m scripts.price_comparison_scan --sport nfl --out docs/price_comparison_scan_line.json
      - name: Commit line history
        shell: bash
        run: |
          git config user.name "harbin-nfl-line-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f history/market_snapshots.csv ] && git add history/market_snapshots.csv || true
          [ -d history/market_snapshots.csv.events ] && git add history/market_snapshots.csv.events || true
          git add history/price_scan_v1 docs/price_comparison_scan_line.json
          [ -f outputs/line_capture_status.json ] && git add outputs/line_capture_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "lines: capture verified NFL pre-kickoff market snapshot"
            bash scripts/push_generated_state.sh
          else
            echo "No new market snapshot."
          fi
