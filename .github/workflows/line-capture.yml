name: NFL Market Line Capture

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season year (blank = auto-detect)"
        required: false
        default: ""
      week:
        description: "Week number (blank = auto-detect)"
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('nfl-line-capture-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_run'
      && format('nfl-generated-state-{0}', github.event.workflow_run.head_branch)
      || format('nfl-generated-state-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Capture current markets
        shell: bash
        run: |
          ARGS="--refresh"
          [ -n "${{ inputs.season }}" ] && ARGS="$ARGS --season ${{ inputs.season }}"
          [ -n "${{ inputs.week }}" ] && ARGS="$ARGS --week ${{ inputs.week }}"
          python capture_lines.py $ARGS

      - name: Commit line history
        shell: bash
        run: |
          git config user.name "harbin-nfl-line-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f history/market_snapshots.csv ] && git add history/market_snapshots.csv || true
          [ -f outputs/line_capture_status.json ] && git add outputs/line_capture_status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "lines: capture verified NFL pre-kickoff market snapshot"
            git pull --rebase origin main
            git push
          else
            echo "No new market snapshot."
          fi
