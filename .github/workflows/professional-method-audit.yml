name: BetMGM Professional Method Audit Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/professional-method-audit.yml"
      - "scripts/professional_method_audit.py"
      - "tests/test_professional_method_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner (free)
        run: python -m pip install pytest
      - name: Test exact-contract, as-of, expert-leakage and CLV guards
        run: python -m pytest -q tests/test_professional_method_audit.py
      - name: Record PASS-only software scope
        run: echo "These are software unit tests. Prediction skill, accepted odds and BetMGM edge remain UNVALIDATED."
