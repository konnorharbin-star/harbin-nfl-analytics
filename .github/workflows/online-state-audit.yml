name: NFL Online State Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nfl/online_state.py"
      - "nfl/online_state_dataset.py"
      - "nfl/online_state_fixed.py"
      - "nfl/online_state_audit.py"
      - "run_online_state_audit.py"
      - "tests/test_online_state.py"
      - "docs/STAGE20_ONLINE_STATE.md"
      - ".github/workflows/online-state-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q tests/test_online_state.py
      - name: Ruff
        run: ruff check .
      - name: Run 2021-2025 online-state audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python run_online_state_audit.py --refresh --output online_state_audit.json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: online-state-audit
          path: online_state_audit.json
