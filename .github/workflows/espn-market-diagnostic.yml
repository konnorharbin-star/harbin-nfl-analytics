name: ESPN NFL Market Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "run_espn_market_diagnostic.py"
      - ".github/workflows/espn-market-diagnostic.yml"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        default: "2026"
        type: string
      week:
        description: "Optional week"
        required: false
        default: ""
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SEASON: ${{ inputs.season || '2026' }}
      TARGET_WEEK: ${{ inputs.week || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Inspect ESPN scoreboard and Core odds
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          if [ -n "$TARGET_WEEK" ]; then
            python run_espn_market_diagnostic.py "$TARGET_SEASON" --week "$TARGET_WEEK" \
              | tee reports/espn_market_diagnostic.json
          else
            python run_espn_market_diagnostic.py "$TARGET_SEASON" \
              | tee reports/espn_market_diagnostic.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: espn-nfl-market-diagnostic
          path: reports/espn_market_diagnostic.json
