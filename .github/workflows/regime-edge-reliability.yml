name: NFL Regime Edge Reliability

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Free ESPN Historical Market Backtest"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/regime_reliability.py"
      - "nfl/policy_calibration.py"
      - "nfl/market_intel.py"
      - "run_regime_reliability.py"
      - "tests/test_regime_reliability.py"
      - ".github/workflows/regime-edge-reliability.yml"
  push:
    branches: [main]
    paths:
      - "nfl/regime_reliability.py"
      - "nfl/policy_calibration.py"
      - "nfl/market_intel.py"
      - "run_regime_reliability.py"
      - "tests/test_regime_reliability.py"
      - ".github/workflows/regime-edge-reliability.yml"

permissions:
  contents: write

concurrency:
  group: >-
    nfl-regime-edge-reliability-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Regime reliability tests
        run: python -m pytest -q tests/test_regime_reliability.py tests/test_policy_calibration.py

      - name: Run regime reliability audit
        run: python run_regime_reliability.py

      - name: Upload regime report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-regime-edge-reliability
          path: |
            reports/regime_edge_reliability.json
            docs/regime_edge_reliability.json

      - name: Commit regime report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/regime_edge_reliability.json \
            docs/regime_edge_reliability.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh NFL regime edge reliability"
            bash scripts/push_generated_state.sh
          else
            echo "No regime reliability changes to commit."
          fi