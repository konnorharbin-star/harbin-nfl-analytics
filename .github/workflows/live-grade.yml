name: NFL Live Shadow Grading

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["NFL Model + Operations"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/grading.py"
      - "nfl/forward_edge_validation.py"
      - "grade_forward_edge.py"
      - "nfl/market_benchmarks.py"
      - "run_forward_market_benchmarks.py"
      - "tests/test_market_benchmarks.py"
      - "tests/test_forward_edge_validation.py"
      - "nfl/grading_audit.py"
      - "nfl/release_gate.py"
      - "grade_live.py"
      - "tests/test_operational_parity.py"
      - "tests/test_audit_parity.py"
      - "tests/test_monitoring_release.py"
      - ".github/workflows/live-grade.yml"
  push:
    branches: [main]
    paths:
      - "history/**"
      - "nfl/grading.py"
      - "nfl/grading_audit.py"
      - "nfl/recent_form_forward.py"
      - "nfl/forward_edge_validation.py"
      - "grade_forward_edge.py"
      - "tests/test_forward_edge_validation.py"
      - "grade_live.py"
      - "grade_recent_form_forward.py"
      - "nfl/market_benchmarks.py"
      - "run_forward_market_benchmarks.py"
      - "tests/test_market_benchmarks.py"
      - ".github/workflows/live-grade.yml"
  schedule:
    - cron: "37 10,16,22 * * *"
permissions:
  contents: write
concurrency:
  group: >-
    nfl-live-grade-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  grade:
    # workflow_run fires after a GITHUB_TOKEN-published model commit even when
    # the separate push event cannot trigger another GitHub Actions workflow.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # The latest generated ledger is committed after the model started,
          # so do not grade the original workflow_run head SHA.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_operational_parity.py \
            tests/test_audit_parity.py \
            tests/test_monitoring_release.py \
            tests/test_recent_form_forward.py \
            tests/test_forward_edge_validation.py \
            tests/test_market_benchmarks.py

      - name: Grade completed paper/shadow bets
        run: python grade_live.py

      - name: Grade prospective recent-form totals shadow
        run: python grade_recent_form_forward.py

      - name: Grade first-snapshot NFL market-relative research
        run: python grade_forward_edge.py

      - name: Benchmark frozen 2026 NFL model against market-only alternatives
        run: python run_forward_market_benchmarks.py

      - name: Commit live evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-grade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            reports/live_performance.json \
            reports/live_graded_bets.csv \
            reports/grading_audit.json \
            outputs/live_performance.json \
            docs/live_performance.json \
            reports/recent_form_forward.json \
            reports/recent_form_forward_graded.csv \
            docs/recent_form_forward.json \
            reports/forward_edge_validation.json \
            reports/forward_edge_graded.csv \
            outputs/forward_edge_validation.json \
            outputs/forward_edge_graded.csv \
            docs/forward_edge_validation.json \
            docs/forward_edge_graded.csv \
            reports/forward_market_benchmarks.json \
            reports/forward_market_benchmark_forecasts.csv \
            reports/forward_market_benchmark_policies.csv \
            reports/forward_market_benchmark_weeks.csv \
            outputs/forward_market_benchmarks.json \
            outputs/forward_market_benchmark_forecasts.csv \
            outputs/forward_market_benchmark_policies.csv \
            outputs/forward_market_benchmark_weeks.csv \
            docs/forward_market_benchmarks.json \
            docs/forward_market_benchmark_forecasts.csv \
            docs/forward_market_benchmark_policies.csv \
            docs/forward_market_benchmark_weeks.csv; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "grade: refresh independent NFL live shadow evidence"
            bash scripts/push_generated_state.sh
          else
            echo "No new completed NFL evidence to grade."
          fi
