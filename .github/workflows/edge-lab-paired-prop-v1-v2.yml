name: NFL v1 versus v2 Frozen Prop Forward Comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-paired-prop-v1-v2.yml"
      - "scripts/paired_v1_v2_forward_prop_audit.py"
      - "tests/test_paired_v1_v2_forward_prop_audit.py"
  workflow_dispatch:
  schedule:
    - cron: "37 12 * 10,11,12 *"

permissions:
  contents: read

jobs:
  paired-only-first-seen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original probability chronology and exact grade matches
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_paired_v1_v2_forward_prop_audit.py
      - name: Evaluate source-original settled-only matching contracts
        run: |
          python -m scripts.paired_v1_v2_forward_prop_audit \
            --v1 history/player_prop_outcomes_2026.jsonl \
            --v2 history/prop_participation_outcomes_v2_2026.jsonl \
            --report reports/paired_v1_v2_prop_forward.json
      - name: Enforce no retrospective wager/profit assertion
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open("reports/paired_v1_v2_prop_forward.json"))
          assert r["decision"]=="PASS" and r["profitable_betting_edge"] is None
          assert not r["betting_recommendations"]
          s="\n".join([
            "## Frozen original NFL prop probabilities — v1 vs v2",
            f"Matched exact scored player markets: {r['matched_exact_contracts']}",
            f"Unique matched player/game/stat clusters: {r['matched_player_game_market_clusters']}",
            f"Distinct games: {r['matched_distinct_games']}",
            f"Per-market game-cluster Brier delta: {r['by_market']}",
            "No current source-origin quote or BetMGM accepted ticket.",
            "No player-prop book edge validated. PASS.",
          ])
          print(s)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(s+"\n")
          PY
      - name: Preserve comparable forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-paired-2026-v1-v2-probability-grade
          path: reports/paired_v1_v2_prop_forward.json
          retention-days: 90
