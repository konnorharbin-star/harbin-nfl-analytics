name: Recent Form PBP Rolling Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/recent_form.py"
      - "nfl/recent_form_dataset.py"
      - "nfl/recent_form_residuals.py"
      - "nfl/recent_form_audit.py"
      - "run_recent_form_audit.py"
      - "tests/test_recent_form.py"
      - ".github/workflows/recent-form-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run recent-form rolling-origin audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          for attempt in 1 2 3; do
            echo "Recent-form source audit attempt ${attempt}/3"
            if python run_recent_form_audit.py --refresh | tee reports/recent_form_audit.json; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "Recent-form source audit failed after 3 attempts" >&2
          exit 1

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: recent-form-pbp-rolling-audit
          path: reports/recent_form_audit.json
