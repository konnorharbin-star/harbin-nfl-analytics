name: Frozen Prop Contract Research Checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-frozen-prop-contract.yml"
      - "scripts/frozen_prop_contract_adapter.py"
      - "tests/test_frozen_prop_contract_adapter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify frozen forecast exact-player match and nonpromotional results
        run: python -m pytest -q tests/test_frozen_prop_contract_adapter.py tests/test_contract_first_scanner.py tests/test_professional_method_audit.py
      - name: Public betting feed not connected
        run: echo "No observed account price and no profitable model approval"
