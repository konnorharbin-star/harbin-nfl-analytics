name: NFL Historical Edge Failure Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "NFL Market Edge Shrinkage"
      - "NFL Regime Edge Reliability"
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - "nfl/historical_edge_diagnostics.py"
      - "run_historical_edge_diagnostics.py"
      - "tests/test_historical_edge_diagnostics.py"
      - "nfl/publication.py"
      - ".github/workflows/historical-edge-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "nfl/historical_edge_diagnostics.py"
      - "run_historical_edge_diagnostics.py"
      - "tests/test_historical_edge_diagnostics.py"
      - ".github/workflows/historical-edge-diagnostics.yml"
  schedule:
    - cron: "29 13 * * 2"

permissions:
  contents: write

concurrency:
  group: >-
    nfl-historical-edge-audit-${{
      github.event_name == 'workflow_run'
      && github.event.workflow_run.head_branch
      || github.ref_name
    }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify preregistered evidence audit
        run: python -m pytest -q tests/test_historical_edge_diagnostics.py

      - name: Audit NFL model probability and archival edge realization
        run: python run_historical_edge_diagnostics.py

      - name: Upload historical diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-historical-edge-failure-audit
          path: |
            reports/historical_edge_failure.json
            reports/historical_edge_segments.csv
            outputs/historical_edge_failure.json
            outputs/historical_edge_segments.csv
            docs/historical_edge_failure.json
            docs/historical_edge_segments.csv

      - name: Commit research-only evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/historical_edge_failure.json \
            reports/historical_edge_segments.csv \
            outputs/historical_edge_failure.json \
            outputs/historical_edge_segments.csv \
            docs/historical_edge_failure.json \
            docs/historical_edge_segments.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh NFL historical edge failure diagnostics"
            bash scripts/push_generated_state.sh
          else
            echo "No historical diagnostic changes to commit."
          fi
