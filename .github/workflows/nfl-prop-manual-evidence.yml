name: Manual NFL Prop Quote Evidence — Research Only
on:
  pull_request:
    paths:
      - scripts/nfl_prop_manual_evidence_intake.py
      - tests/test_nfl_prop_manual_evidence_intake.py
      - research/nfl_prop_manual_evidence_2026.json
      - .github/workflows/nfl-prop-manual-evidence.yml
  push:
    branches: [main]
    paths:
      - scripts/nfl_prop_manual_evidence_intake.py
      - tests/test_nfl_prop_manual_evidence_intake.py
      - research/nfl_prop_manual_evidence_2026.json
      - .github/workflows/nfl-prop-manual-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Source-permission, GSIS and cutoff regression tests
        run: python -m pytest -q tests/test_nfl_prop_manual_evidence_intake.py tests/test_nfl_prop_exact_public_market_shadow.py
      - name: Empty manual capture never creates offers or bets
        run: |
          python -m scripts.nfl_prop_manual_evidence_intake
          python - <<'PY'
          import json
          d=json.load(open('reports/nfl_prop_manual_evidence_intake_2026.json'))
          assert d['human_observation_rows_in_input']==0
          assert d['strict_first_seen_candidates']['new']==0
          assert d['validated_executable_BetMGM_account_prices']==0
          assert d['true_ev'] is None and d['decision']=='PASS'
          assert d['automated_scraping'] is False
          print('PASS: no sourced live quote or wager has been fabricated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-manual-prop-evidence-no-bets
          path: reports/nfl_prop_manual_evidence_intake_2026.json
          retention-days: 30
