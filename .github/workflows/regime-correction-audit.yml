name: NFL Regime Correction Audit

on:
  pull_request:
    paths:
      - "nfl/regime_corrections.py"
      - "nfl/regime_correction_audit.py"
      - "nfl/schedule_context.py"
      - "nfl/ratings.py"
      - "tests/test_regime_corrections.py"
      - "run_regime_correction_audit.py"
      - ".github/workflows/regime-correction-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q tests/test_regime_corrections.py
      - name: Ruff
        run: >-
          ruff check nfl/regime_corrections.py nfl/regime_correction_audit.py
          run_regime_correction_audit.py tests/test_regime_corrections.py
      - name: Run 2022-2025 targeted correction audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python run_regime_correction_audit.py --refresh |
            tee reports/regime_correction_audit.log
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: nfl-regime-correction-audit
          path: |
            reports/regime_correction_audit.json
            reports/regime_correction_audit.log
          if-no-files-found: error
