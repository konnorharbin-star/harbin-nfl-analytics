name: NFL Web Research — Public Pages and Prop Prices
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-public-web-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free model dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test public page identity and paired-price parsing
        run: python -m pytest -q tests/test_web_model_intake.py
      - name: Generate own football predictions from free public data
        run: python run_nfl_predictions.py 2026
      - name: Archive dated web evidence and missing-source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-public-web-research-NOT-PROVEN-EDGE
          path: |
            outputs/independent_forecasts.json
            reports/nfl_web_model_intake.json
            reports/nfl_web_prop_contracts.json
            reports/web_source_snapshots
          if-no-files-found: warn
          retention-days: 45
