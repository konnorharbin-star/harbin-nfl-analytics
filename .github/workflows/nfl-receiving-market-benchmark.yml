name: NFL Receiving Yards — Real Price Benchmark
on:
  workflow_dispatch:
    inputs:
      players:
        description: 'Top 2024 target-volume receivers to import (1..20; max 200 free credits)'
        type: choice
        options: ['20', '10', '5', '1']
        default: '20'
permissions:
  contents: read
concurrency:
  group: nfl-receiving-market-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free model dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test market matching and quota failure handling
        run: python -m pytest -q tests/test_receiving_market_benchmark.py
      - name: Import free-account history and benchmark fixed model against real lines
        env:
          ENDZONE_API_KEY: ${{ secrets.ENDZONE_API_KEY }}
          IMPORT_PLAYER_COUNT: ${{ inputs.players }}
        run: python -m scripts.nfl_receiving_market_benchmark --fetch-free-history --players "$IMPORT_PLAYER_COUNT"
      - name: Archive evidence and explicit source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiving-real-price-diagnostic-NOT-PROVEN-EDGE
          path: |
            reports/receiving_actual_market_history.json
            reports/receiving_real_price_benchmark.json
          if-no-files-found: warn
          retention-days: 45
