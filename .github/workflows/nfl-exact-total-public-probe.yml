name: NFL exact public total versus frozen model (research only)
on:
  workflow_dispatch:
    inputs:
      original_research_run_id:
        description: "Original dated NFL score/drive research workflow run"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free statistical dependencies
        run: python -m pip install -e .
      - name: Download exact original football research inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.original_research_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p archived
          gh run download "$SOURCE_RUN_ID" -n nfl-free-coupled-score-props-RESEARCH-UNVALIDATED -D archived
          find archived -name coupled_drive_player_shadow.json -type f | grep -q .
          find archived -name coupled_replay_inputs.json -type f | grep -q .
      - name: Compare identical full-game total thresholds with reported public quotes
        run: |
          FORECAST=$(find archived -name coupled_drive_player_shadow.json -type f | head -1)
          REPLAY=$(find archived -name coupled_replay_inputs.json -type f | head -1)
          python -m scripts.nfl_research_exact_total_quote_probe --forecasts "$FORECAST" --replay "$REPLAY" --quotes research/public_nfl_total_quote_20261013_oct15.json --out reports/nfl_research_exact_total_quote_probe.json
      - name: Archive no-bet research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-exact-total-public-market-RESEARCH-ONLY
          path: reports/nfl_research_exact_total_quote_probe.json
          if-no-files-found: warn
          retention-days: 45
