name: NFL Predeclared Single Anchor Player Prop Lines — Research
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/edge-lab-prop-primary-anchor.yml"
      - "scripts/nfl_prop_primary_anchor_cohort.py"
      - "tests/test_nfl_prop_primary_anchor_cohort.py"
  workflow_dispatch:
  schedule:
    - cron: "08 16 * 9,10,11,12 *"
permissions:
  contents: write
concurrency:
  group: nfl-primary-player-prop-anchors-2026
  cancel-in-progress: false
jobs:
  freeze-single-anchor-before-kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only schedule cohort work during 2026
        id: guard
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(date -u +%Y)" != "2026" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install original research dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Test distribution monotonicity, complete 7 lines and pregame original
        if: steps.guard.outputs.enabled == 'true'
        run: python -m pytest -q tests/test_nfl_prop_primary_anchor_cohort.py
      - name: Freeze baseline-only anchor rule before kickoff without player outcomes
        if: steps.guard.outputs.enabled == 'true'
        run: python -m scripts.nfl_prop_primary_anchor_cohort
      - name: Preserve separate source-independent first-seen anchor study
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f history/player_prop_primary_anchor_v1_2026.jsonl ]]; then
            git add history/player_prop_primary_anchor_v1_2026.jsonl
            if ! git diff --cached --quiet; then
              git commit -m 'research: freeze anchor-only original NFL prop probability comparison before kickoff'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Confirm anchor study never promotes any wager
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json
          r=json.load(open("reports/player_prop_primary_anchor_v1_2026.json"))
          assert r["decision"]=="PASS"
          assert r["actual_BetMGM_bookmaker_quotes"]==0
          assert r["prospective_bets"]==0 and r["true_EV"] is None
          assert not r["true_BetMGM_approval"]
          assert r["original_4886_probability_records_modified"] is False
          print("Complete 7-line CDF groups:",r["complete_player_game_market_groups"])
          print("New strictly pregame single anchors:",r["first_seen_written"])
          print("Market coverage and model disagreement:",r["by_market"])
          print("PASS: no bookmaker valuation.")
          PY
      - name: Preserve primary study design diagnostics
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nfl-prop-primary-single-anchor-source-audit
          path: reports/player_prop_primary_anchor_v1_2026.json
          if-no-files-found: warn
          retention-days: 90
