name: NFL Forward Ledger Health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "nfl/forward_ledger_health.py"
      - "nfl/forward_shadow.py"
      - "run_forward_ledger_health.py"
      - "tests/test_forward_ledger_health.py"
      - "tests/test_forward_shadow.py"
      - ".github/workflows/forward-ledger-health.yml"
      - ".github/workflows/forward-shadow-summary.yml"
  push:
    branches: [main]
    paths:
      - "history/probability_shadow_predictions_v1.csv"
      - "history/qb_total_shadow_predictions_v1.csv"
      - "history/recent_form_shadow_predictions_v1.csv"
      - "nfl/forward_ledger_health.py"
      - "nfl/forward_shadow.py"
      - "run_forward_ledger_health.py"
      - ".github/workflows/forward-ledger-health.yml"
  schedule:
    - cron: "7 0,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-forward-ledger-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Integrity tests
        run: |
          python -m pytest -q             tests/test_forward_ledger_health.py             tests/test_forward_shadow.py

      - name: Audit frozen forward ledgers
        run: python run_forward_ledger_health.py --refresh

      - name: Upload ledger health
        uses: actions/upload-artifact@v4
        with:
          name: nfl-forward-ledger-health
          path: |
            reports/forward_ledger_health.json
            docs/forward_ledger_health.json

      - name: Commit ledger health
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "harbin-nfl-grade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/forward_ledger_health.json docs/forward_ledger_health.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: refresh NFL forward ledger health"
            git pull --rebase origin main
            git push
          else
            echo "No forward ledger health changes to commit."
          fi
