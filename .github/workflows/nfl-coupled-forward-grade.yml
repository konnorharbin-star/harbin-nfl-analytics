name: NFL coupled forecast postgame research grader
on:
  workflow_dispatch:
    inputs:
      research_run_id:
        description: "Original pregame NFL research GitHub Actions run ID"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free source dependencies
        run: python -m pip install -e .
      - name: Download exact prior pregame research artifact and score mature games
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.research_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p archived
          gh run download "$SOURCE_RUN_ID" -n nfl-free-coupled-score-props-RESEARCH-UNVALIDATED -D archived
          ORIGINAL=$(find archived -name coupled_drive_player_shadow.json -type f | head -1)
          test -n "$ORIGINAL"
          python -m scripts.nfl_coupled_forward_grade_run --snapshot "$ORIGINAL" --out reports/coupled_forward_grade.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-coupled-frozen-forward-grades-RESEARCH
          path: reports/coupled_forward_grade.json
          if-no-files-found: error
          retention-days: 60
