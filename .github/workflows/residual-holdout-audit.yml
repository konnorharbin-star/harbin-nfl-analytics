name: Residual Holdout Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "nfl/residuals.py"
      - "nfl/residual_audit.py"
      - "run_residual_audit.py"
      - ".github/workflows/residual-holdout-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run nested residual holdout
        run: |
          mkdir -p reports
          python run_residual_audit.py --refresh | tee reports/residual_holdout_audit.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: residual-holdout-audit
          path: reports/residual_holdout_audit.json
