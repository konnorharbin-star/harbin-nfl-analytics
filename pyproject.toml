[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbin-nfl-analytics"
version = "0.1.0"
description = "Leakage-safe NFL analytics and betting-model research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.1",
  "numpy>=1.26",
  "Pillow>=10.0",
  "polars>=1.0",
  "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["nfl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
