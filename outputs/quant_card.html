<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbin NFL Quant Card</title><style>body{background:#0f1113;color:#f0f1f2;font-family:Arial,sans-serif;margin:24px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #333}th{text-align:left;color:#969ba1}a{color:#74a7ff}.recommendation-row.expired{color:#777c81}</style></head><body><h1>Harbin NFL · Model Suggestions</h1><p>Current executable evidence-gated signals only. Every recommendation has a hard expiration; portfolio action remains authoritative.</p><p><a href="./">← Weekly board</a> · <a href="audit.html">System audit</a></p><table><thead><tr><th>Matchup</th><th>Signal</th><th>Market</th><th>Side</th><th>Line</th><th>Odds</th><th>Book</th><th>Valid until</th><th>Portfolio</th></tr></thead><tbody><tr><td colspan="9">No current executable model suggestions.</td></tr></tbody></table><script>function expireRows(){const now=Date.now();document.querySelectorAll('.recommendation-row[data-valid-until]').forEach(r=>{const expiry=Date.parse(r.dataset.validUntil||'');if(Number.isFinite(expiry)&&now>=expiry){r.classList.add('expired');const s=r.querySelector('[data-role=signal]');if(s)s.textContent='EXPIRED';const p=r.querySelector('[data-role=portfolio]');if(p)p.textContent='EXPIRED';}})}expireRows();setInterval(expireRows,15000)</script></body></html>
